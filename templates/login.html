{% extends 'base.html' %}
{% block title %}ورود به Edge Panel{% endblock %}
{% block body %}
<section class="card login">
  <h1>ورود به پنل</h1>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>رمز مدیریت
      <input type="password" name="password" autocomplete="current-password" dir="ltr" required autofocus>
    </label>
    <button type="submit">ورود</button>
  </form>
</section>
{% endblock %}
