limit_req_zone $binary_remote_addr zone=edge_login:1m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name @NAMES@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/edge-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8081 default_server;
    root /var/www/edge-panel;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name @API@;
    root /var/www/edge-panel;
    location = / {
        try_files /api.html =404;
    }
    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:15001;
    server_name 127.0.0.1;
    client_max_body_size 4k;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    location = /login {
        limit_req zone=edge_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:15000;
    }
    location / {
        proxy_pass http://127.0.0.1:15000;
    }
}
