map "$request_method:$uri" $edge_admin_login_key {
    default "";
    ~^POST:/(edge-panel/)?login$ $server_name;
}
limit_req_zone $edge_admin_login_key zone=edge_admin_login:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name @NAMES@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/edge-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8081 default_server;
    root /var/www/edge-panel;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name @API@;
    root /var/www/edge-panel;
    absolute_redirect off;
    location = /edge-panel {
        return 308 /edge-panel/;
    }
    location ^~ /edge-panel/ {
        include /etc/edge-panel/panel-proxy.conf;
        proxy_set_header Host @API@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /edge-panel;
    }
    location = / {
        try_files /api.html =404;
    }
    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:15001;
    server_name 127.0.0.1;
    location / {
        include /etc/edge-panel/panel-proxy.conf;
        proxy_set_header Host 127.0.0.1:15001;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix "";
    }
}
